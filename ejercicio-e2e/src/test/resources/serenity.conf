webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome"
        "goog:chromeOptions" {
            args = [
                "--start-maximized",
                "--disable-notifications",
                "--disable-popup-blocking",
                "--no-sandbox",
                "--disable-dev-shm-usage"
            ]
        }
    }
}

headless.mode = false

serenity {
    project.name = "Ejercicio E2E - Flujo de Compra"
    test.root = "com.co.jesusr"
    requirements.dir = "src/test/resources/features"
    take.screenshots = AFTER_EACH_STEP
    reports.show.step.details = true
}

environments {
    default {
        webdriver.base.url = "http://opencart.abstracta.us/"
    }
}