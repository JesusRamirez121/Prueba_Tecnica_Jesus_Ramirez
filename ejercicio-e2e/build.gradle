defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral()
    mavenLocal()
}

buildscript {
    repositories {
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "net.serenity-bdd:serenity-gradle-plugin:4.2.1"
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: "net.serenity-bdd.serenity-gradle-plugin"

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

ext {
    serenity_version                      = '4.2.1'
    junit_platform_launcher_version       = "1.11.0"
    cucumber_junit_platform_engine_version = "7.16.1"
    junit_platform_suite_version          = "1.11.0"
    junit_jupiter_engine_version          = "5.11.0"
    logback_classic_version               = "1.4.+"
    assertj_core_version                  = "3.24.2"
    lombok_version                        = "1.18.34"
}

configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-jdk14'
    exclude group: 'org.slf4j', module: 'slf4j-nop'
    exclude group: 'org.slf4j', module: 'org.slf4j:slf4j-simple'
}

dependencies {
    // ─── src/main/java: Tasks, UI, Questions ─────────────────────────────────
    // Estas clases viven en main, por eso usan 'implementation'
    implementation "net.serenity-bdd:serenity-core:${serenity_version}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenity_version}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenity_version}"
    implementation "net.serenity-bdd:serenity-ensure:${serenity_version}"
    implementation "ch.qos.logback:logback-classic:${logback_classic_version}"
    implementation "org.assertj:assertj-core:${assertj_core_version}"
    implementation("io.github.bonigarcia:webdrivermanager:5.7.0") {
        exclude group: "org.seleniumhq.selenium", module: "selenium-java"
    }
    compileOnly     "org.projectlombok:lombok:$lombok_version"
    annotationProcessor "org.projectlombok:lombok:$lombok_version"

    // ─── src/test/java: Runner, Steps ────────────────────────────────────────
    // Cucumber + JUnit 5 Platform Suite + Serenity Cucumber → solo en tests
    testImplementation "net.serenity-bdd:serenity-junit:${serenity_version}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenity_version}"
    testImplementation "org.junit.platform:junit-platform-launcher:${junit_platform_launcher_version}"
    testImplementation "org.junit.platform:junit-platform-suite:${junit_platform_suite_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junit_jupiter_engine_version}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumber_junit_platform_engine_version}"
}

test {
    useJUnitPlatform()

    def environment = System.getProperty("environment")
    if (environment != null && !environment.trim().isEmpty()) {
        jvmArgs("-Denvironment=${environment}")
    }

    // Mostrar en consola si un test falla
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

// Continuar aunque fallen tests (para generar reporte de fallos también)
gradle.startParameter.continueOnFailure = true

// El reporte Serenity se genera automáticamente después de los tests
test.finalizedBy(aggregate)
